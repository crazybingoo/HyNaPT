name: MATLAB and privacy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for clinical-data hazards
        run: python tools/privacy_scan.py .

  matlab-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2021b
          products: |
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: startup; results = runtests('tests'); assertSuccess(results)
